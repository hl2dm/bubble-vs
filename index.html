<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0b0f24"><title>泡泡對決：沈柏楊 vs 蔣萬安</title>
<style>
@font-face{font-family:"GenSenHeavyTW";src:url("fonts/GenSenHeavyTW.woff2") format("woff2");font-weight:900;font-display:block;}
@font-face{font-family:"GenSenBoldTW";src:url("fonts/GenSenBoldTW.woff2") format("woff2");font-weight:700;font-display:block;}
@font-face{font-family:"Bungee";src:url("fonts/Bungee.woff2") format("woff2");font-weight:400;font-display:block;}
@font-face{font-family:"PressStart2P";src:url("fonts/PressStart2P.woff2") format("woff2");font-weight:400;font-display:block;}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{display:flex;align-items:center;justify-content:center;font-family:"GenSenBoldTW",sans-serif;
 background:radial-gradient(ellipse at center,rgba(40,60,140,0.55) 0%,rgba(8,10,30,0.92) 70%),url("art/gpt/v4_bg_pattern.png") center/cover,#0b0f24}
#stage{position:fixed;left:env(safe-area-inset-left);right:env(safe-area-inset-right);top:env(safe-area-inset-top);bottom:env(safe-area-inset-bottom);display:flex;align-items:center;justify-content:center}
@media (orientation:portrait){html.touch #stage{bottom:calc(env(safe-area-inset-bottom) + 172px)}}
canvas{touch-action:none;display:block;box-shadow:0 0 0 3px #e9b84a,0 0 0 6px #5a3a10,0 0 60px #000c;image-rendering:auto}
#tc{position:fixed;inset:0;pointer-events:none;display:none;z-index:5}
#tc.show{display:block}
#tc .g{position:absolute;display:grid;grid-template-columns:repeat(2,64px);gap:10px;bottom:calc(env(safe-area-inset-bottom) + 14px)}
#tc .gl{left:calc(env(safe-area-inset-left) + 12px)}#tc .gr{right:calc(env(safe-area-inset-right) + 12px)}
#tc button{pointer-events:auto;touch-action:none;width:64px;height:64px;border-radius:50%;border:3px solid #e9b84a;background:radial-gradient(circle at 35% 30%,#3b4b9a,#141a40);color:#fff;font:700 18px "GenSenBoldTW",sans-serif;text-shadow:0 2px 0 #000;box-shadow:0 4px 0 #5a3a10,0 0 12px #0008;opacity:.85;padding:0}
#tc button.on{transform:translateY(3px);box-shadow:0 1px 0 #5a3a10;opacity:1}
#tc button.fire{background:radial-gradient(circle at 35% 30%,#ff7a59,#8a1d10)}
#tc button.sk{background:radial-gradient(circle at 35% 30%,#666,#222);font-size:16px}
#tc button.sk.ready{background:radial-gradient(circle at 35% 30%,#ffe066,#b8860b);color:#3a2200;text-shadow:none;animation:pulse .8s infinite alternate}
@keyframes pulse{to{box-shadow:0 4px 0 #5a3a10,0 0 22px #ffd24a}}
#tc.two .gr .p2only{order:-1}#tc .g .p2only{display:none}#tc.two .g .p2only{display:block}
@media (orientation:portrait){#tc .g{grid-template-columns:repeat(2,70px)}#tc button{width:70px;height:70px}}
@media (orientation:landscape) and (max-height:500px){#tc .g{grid-template-columns:repeat(1,56px)}#tc button{width:56px;height:56px;font-size:16px}#tc.two .g{grid-template-columns:repeat(2,52px)}#tc.two button{width:52px;height:52px}}
</style></head>
<body><div id="stage"><canvas id="c" width="960" height="640"></canvas></div>
<div id="tc"><div class="g gl"><button data-p1="k:ArrowLeft" data-p2="k:KeyA">◀</button><button data-p1="k:ArrowRight" data-p2="k:KeyD">▶</button><button class="fire p2only" data-p2="fireL">發射</button><button class="sk p2only" data-p2="skillL">技能</button></div>
<div class="g gr"><button class="fire" data-p1="fire" data-p2="fireR">發射</button><button class="sk" data-p1="skill" data-p2="skillR">技能</button><button class="p2only" data-p2="k:ArrowLeft">◀</button><button class="p2only" data-p2="k:ArrowRight">▶</button></div></div><script src="game.js"></script></body></html>
